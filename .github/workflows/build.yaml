name: Build

on:
  pull_request:
  push:
    paths-ignore:
      - "*.md"
      - "LICENSE*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # the portable kernel alone is built on these
          targets: aarch64-apple-darwin, aarch64-unknown-linux-gnu
      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@v2
      - name: Cargo check
        run: cargo check --all-targets --all-features --workspace
      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features --workspace
      - name: Cargo clippy (aarch64)
        run: |
          cargo clippy --all-targets --all-features --workspace --target aarch64-apple-darwin
          cargo clippy --all-targets --all-features --workspace --target aarch64-unknown-linux-gnu

  fmt:
    name: Format
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cargo fmt
        run: cargo fmt --all --check

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@v2
      - name: Cargo doc
        run: cargo doc --no-deps --all-features --workspace

  deny:
    name: Deny
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # Prevent new advisories from failing CI
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  test:
    name: Test (${{ matrix.platform }}, ${{ matrix.toolchain }})
    strategy:
      matrix:
        # x86-64 runs both kernels and checks they agree; the arm64 macOS runner the portable one
        platform: [ ubuntu-latest, windows-latest, macos-latest ]
        # msrv is Cargo.toml's rust-version; stable the latest stable release
        toolchain: [ msrv, stable ]
      fail-fast: false
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Resolve toolchain
        id: toolchain
        shell: bash
        run: |
          if [ '${{ matrix.toolchain }}' = msrv ]; then
            echo "version=$(grep '^rust-version' Cargo.toml | head -1 | awk -F' = ' '{print $2}' | tr -d '"')" >> $GITHUB_OUTPUT
          else
            echo "version=${{ matrix.toolchain }}" >> $GITHUB_OUTPUT
          fi
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@v2
      - name: Cargo test
        run: cargo test --release --all-features --workspace

  check-version:
    name: Check package versions
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [ check, fmt, docs, deny, test ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check git tag against package versions
        shell: bash
        run: |
          set -eou pipefail
          tag='${{github.ref}}'
          tag="${tag#refs/tags/}"
          version=$(grep '^version' Cargo.toml | head -1 | awk -F' = ' '{print $2}' | tr -d '"')
          version="v$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Git tag doesn't match the Cargo version! ($tag != $version)"
            exit 1
          fi

  release-github:
    name: Release (GitHub)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [ check-version ]
    permissions:
      contents: write
    steps:
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
